<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Everything Incremental</title>

		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<main class="game-screen">
			<section id="observationArea" class="observation-area" hidden>
				<h2>Observação</h2>

				<p>Cliques: <span id="totalClicksDisplay">0</span></p>
				<p>
					Total de pontos ganhos:
					<span id="totalPointsEarnedDisplay">0</span>
				</p>
				<p>
					Marcos desbloqueados:
					<span id="unlockedMilestonesDisplay">0</span>
				</p>
			</section>

			<section class="counter-area">
				<div class="points-display">
					Pontos: <span id="pointsCounter">0</span>
				</div>
			</section>

			<section class="action-area">
				<button id="mainButton" class="main-button">gerar ponto</button>
			</section>

			<section id="messageArea" class="message-area" hidden>
				<p id="gameMessage"></p>
			</section>
		</main>

		<script type="module" src="js/main.js"></script>
	</body>
</html>
